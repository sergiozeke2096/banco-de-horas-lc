services:
  lc-banco-horas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lc-banco-horas
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      ALLOW_LOCAL_STORAGE_FALLBACK: "false"
      TRUST_PROXY: "1"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
